name: Optimize background images

on:
  push:
    branches: [main]
    paths:
      - "scripts/convert-backgrounds.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-backgrounds
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Convert semantic JPEG backgrounds to WebP
        run: python scripts/convert-backgrounds.py
      - name: Commit optimized WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/backgrounds/*-v01.webp
          if git diff --cached --quiet; then
            echo "No new WebP assets."
          else
            git commit -m "assets: add optimized background WebP variants"
            git push origin HEAD:main
          fi
