name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check game JavaScript syntax
        run: node --check site/game.js && node --check site/chapter-intro.js
      - name: Validate game data
        run: node scripts/validate-game-data.js
      - name: Validate legacy manual save migration
        run: node scripts/validate-manual-save-migration.js
      - name: Validate autosave migration and fallback
        run: node scripts/validate-autosave-migration.js
      - name: Validate story and route draft lengths and Markdown sync
        run: node scripts/validate-route-drafts.js
      - name: Validate aggregate full-story length summaries
        run: node scripts/validate-full-length-summary.js
      - name: Validate prologue revision sync
        run: node scripts/validate-prologue-revisions.js
      - name: Validate game HTML shells
        run: node scripts/validate-game-shells.js
      - name: Inspect visual asset metadata
        run: node scripts/inspect-visual-assets.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
