    fill="none" stroke="#bdb4d0" stroke-width="3" />
  <path d="M129 185Q210 131 291 185L278 355Q210 404 142 355Z" fill="#fff8f1" />
  <path d="M136 180Q110 250 129 382Q98 409 82 456L105 525Q144 458 162 380L158 215Z"
