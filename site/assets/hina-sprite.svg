    <path d="M283 211Q329 165 309 111Q276 135 256 180L264 236Z" />
    <path d="M93 294Q55 260 65 220Q92 231 115 271L111 311Z" />
    <path d="M327 294Q365 260 355 220Q328 231 305 271L309 311Z" />
