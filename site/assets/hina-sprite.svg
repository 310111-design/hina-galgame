  <path d="M107 463Q61 507 99 602" fill="none" stroke="#2b3155" stroke-width="45" stroke-linecap="round" />
  <path d="M313 463Q359 507 321 602" fill="none" stroke="#2b3155" stroke-width="45" stroke-linecap="round" />
