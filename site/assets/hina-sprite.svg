<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-label="空崎陽奈立繪">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" />
      <stop offset=".72" stop-color="#eeeaf7" />
      <stop offset="1" stop-color="#c5bdd7" />
    </linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30385f" />
      <stop offset="1" stop-color="#171c39" />
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#35124f" />
      <stop offset=".5" stop-color="#a92cff" />
      <stop offset="1" stop-color="#1b1234" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <ellipse cx="210" cy="667" rx="158" ry="22" fill="#100d1c" opacity=".5" />

  <!-- halo -->
  <g filter="url(#glow)" fill="none" stroke="#d44cff" stroke-linecap="round">
