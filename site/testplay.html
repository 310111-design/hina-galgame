<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090912">
  <title>放學後的十分鐘｜試玩版 2</title>
  <link rel="stylesheet" href="game.css?v=dialogue-font-size-preference-v1-20261126">
  <link rel="stylesheet" href="chapter-intro.css?v=ui2-20261124">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <a class="back" href="./" aria-label="返回企劃首頁">← 首頁</a>
      <div class="brand"><span class="eyebrow">HINA GALGAME · TESTPLAY</span><h1>放學後的十分鐘</h1></div>
      <div class="top-actions">
        <details id="utilityMenu" class="utility-menu">
          <summary id="utilityMenuTrigger" class="utility-menu-trigger" aria-controls="utilityMenuPanel" aria-expanded="false"><span class="utility-menu-glyph" aria-hidden="true">☰</span><span>功能</span></summary>
          <div id="utilityMenuPanel" class="utility-menu-panel" role="group" aria-label="遊戲功能">
            <p class="utility-menu-heading">遊戲功能</p>
            <a class="utility-menu-item" href="./"><span class="utility-menu-icon" aria-hidden="true">⌂</span><span>返回企劃首頁</span></a>
            <button id="chapterMenu" class="utility-menu-item" type="button" aria-label="選擇章節"><span class="utility-menu-icon" aria-hidden="true">▤</span><span>選擇章節</span></button>
            <button id="returnMain" class="utility-menu-item" type="button" aria-label="返回主線" hidden><span class="utility-menu-icon" aria-hidden="true">↩</span><span>返回主線</span></button>
            <button id="logToggle" class="utility-menu-item" type="button" aria-label="對話紀錄與設定" aria-controls="logPanel" aria-expanded="false"><span class="utility-menu-icon" aria-hidden="true">☷</span><span>對話紀錄與設定</span></button>
            <button id="saveManual" class="utility-menu-item" type="button" aria-label="存檔"><span class="utility-menu-icon" aria-hidden="true">＋</span><span>存檔</span></button>
            <button id="loadManual" class="utility-menu-item" type="button" aria-label="讀檔"><span class="utility-menu-icon" aria-hidden="true">▣</span><span>讀檔</span></button>
            <button id="restart" class="utility-menu-item" type="button" aria-label="從序章重來"><span class="utility-menu-icon" aria-hidden="true">↻</span><span>從序章重來</span></button>
            <button id="fullscreenToggle" class="utility-menu-item" type="button" aria-label="切換全螢幕"><span class="utility-menu-icon" aria-hidden="true">⛶</span><span>全螢幕</span></button>
            <p class="utility-menu-note">按 Esc 可關閉選單</p>
          </div>
        </details>
      </div>
    </header>
    <section class="status" aria-label="遊戲進度">
      <div class="progress-track"><div id="progress" class="progress"></div></div>
      <div class="status-row"><span id="chapterLabel">P01</span><span id="saveState">自動存檔</span><div id="flags" class="flags visually-hidden" aria-label="劇情旗標"></div></div>
    </section>
    <section id="gameStage" class="game-stage" aria-label="遊戲畫面" tabindex="-1">
      <div id="sceneArt" class="scene-art office">
        <div id="chapterToast" class="chapter-toast" aria-live="polite"></div>
        <div class="scene-backdrop"></div><div class="scene-vignette"></div>
        <div class="scene-light"></div>
        <img id="hinaSprite" class="hina-sprite" src="assets/hina-sprite.svg" alt="空崎陽奈立繪" decoding="async" fetchpriority="high">
      </div>
      <section id="chapterIntro" class="chapter-intro-backdrop" role="dialog" aria-modal="true" aria-labelledby="chapterIntroTitle" aria-describedby="chapterIntroCopy" hidden>
        <div class="chapter-intro-card">
          <span class="chapter-intro-kicker">HINA GALGAME · TESTPLAY</span>
          <span id="chapterIntroCode" class="chapter-intro-code"></span>
          <h2 id="chapterIntroTitle" class="chapter-intro-title">放學後的十分鐘</h2>
          <p id="chapterIntroCopy" class="chapter-intro-copy">在故事開始前，先留一點時間給這個場景。</p>
          <button id="chapterIntroStart" class="chapter-intro-start" type="button">開始閱讀</button>
        </div>
      </section>
      <div class="visual-controls"><span id="mood" class="mood visually-hidden">認真</span><button id="audioToggle" class="audio-toggle" type="button" aria-label="切換音樂" aria-pressed="false"><span aria-hidden="true">♫</span><span class="audio-toggle-label">音訊</span></button></div>
      <section class="dialogue-panel">
        <div id="story" class="story"></div>
        <div id="storyAnnouncement" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
        <div id="choices" class="choices" role="group" aria-label="劇情選項" aria-live="polite"></div>
        <div class="dialogue-footer"><div class="dialogue-hint" id="dialogueHint">點擊／Enter／空白鍵 繼續　›</div><button id="skipRead" class="skip-read" type="button" disabled>跳過已讀</button></div>
        <nav class="asset-toolbar" role="toolbar" aria-label="快速遊戲控制">
          <button type="button" data-ui-action="log" aria-label="開啟對話紀錄"><span aria-hidden="true">▤</span><span class="asset-toolbar-label">紀錄</span></button>
          <button type="button" data-ui-action="auto" aria-label="切換自動播放" aria-pressed="false"><span aria-hidden="true">▶</span><span class="asset-toolbar-label">自動</span></button>
          <button type="button" data-ui-action="skip" aria-label="跳過已讀內容" disabled><span aria-hidden="true">»</span><span class="asset-toolbar-label">跳過</span></button>
          <button type="button" data-ui-action="save" aria-label="開啟存檔"><span aria-hidden="true">▣</span><span class="asset-toolbar-label">存檔</span></button>
          <button type="button" data-ui-action="load" aria-label="開啟讀檔"><span aria-hidden="true">⇩</span><span class="asset-toolbar-label">讀檔</span></button>
          <button type="button" data-ui-action="config" aria-label="開啟閱讀設定"><span aria-hidden="true">⚙</span><span class="asset-toolbar-label">設定</span></button>
        </nav>
      </section>
    </section>
  </main>
  <aside id="logPanel" class="log-panel" aria-label="對話紀錄" aria-hidden="true" inert>
    <div class="log-head"><div><span class="eyebrow">DIALOGUE LOG</span><h2>對話紀錄</h2></div><button id="logClose" class="ghost" type="button">關閉</button></div>
    <section class="reading-settings" aria-label="閱讀設定">
      <label for="dialogueFontSize">文字大小
        <select id="dialogueFontSize">
          <option value="16">標準</option>
          <option value="18">稍大</option>
          <option value="20">大字</option>
        </select>
      </label>
      <label for="typingSpeed">文字速度
        <select id="typingSpeed">
          <option value="44">慢</option>
          <option value="26">普通</option>
          <option value="12">快</option>
        </select>
      </label>
      <label class="auto-play-setting"><input id="autoPlayToggle" type="checkbox"> 自動播放</label>
      <label class="volume-setting" for="bgmVolume">BGM 音量
        <input id="bgmVolume" type="range" min="0" max="1" step="0.05" value="0.55">
      </label>
      <label class="volume-setting" for="sfxVolume">音效音量
        <input id="sfxVolume" type="range" min="0" max="1" step="0.05" value="0.65">
      </label>
    </section>
    <div id="logList" class="log-list" aria-live="polite"></div>
  </aside>
  <dialog id="chapterDialog" class="chapter-dialog">
    <div class="dialog-head"><div><span class="eyebrow">CHAPTER SELECT</span><h2>選擇章節</h2></div><button id="closeChapterMenu" class="ghost" type="button">關閉</button></div>
    <p class="dialog-note">所有章節皆可直接進入。選擇章節會從該章開頭開始，以獨立重玩狀態執行，不會覆蓋主線存檔。</p>
    <div id="chapterList" class="chapter-list"></div>
  </dialog>
  <dialog id="saveDialog" class="chapter-dialog save-dialog">
    <div class="dialog-head"><div><span class="eyebrow">SAVE / LOAD</span><h2 id="saveDialogTitle">選擇存檔欄位</h2></div><button id="closeSaveMenu" class="ghost" type="button">關閉</button></div>
    <p id="saveDialogNote" class="dialog-note">選擇一個欄位保存目前進度。</p>
    <div id="saveSlots" class="save-slots"></div>
  </dialog>
  <script src="game-data.js?v=ui2-20261124"></script>
  <script src="game.js?v=ui2-assets-20261124"></script>
  <script src="chapter-intro.js?v=chapter-a11y-20261124"></script>
</body>
</html>
